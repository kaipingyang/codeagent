<title id="title">Request-boundary context management</title>
<desc id="desc">Every provider request sees the pending turn exactly once; cheap controls run before summaries; PTL recovery drops complete rounds. Audience: Integrator / Maintainer. Scope: on_request_start pipeline and provider prompt-too-long recovery.</desc>
